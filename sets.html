<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Laya Staff Task • Set Collection</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg">
  <div class="container" style="max-width:980px;">
    <div class="topbar">
      <div>
        <div class="brand">Laya Staff Task</div>
        <div class="small">Set Collection</div>
      </div>
      <div class="actions">
        <a class="btn secondary" href="./game.html">Back</a>
        <a class="btn secondary" href="./inventory.html">Inventory</a>
        <a class="btn secondary" href="./shop.html">Shop</a>
        <a class="btn secondary" href="./badges.html">Badges</a>
        <a class="btn secondary" href="./quests.html">Quests</a>
        <a class="btn secondary" href="./leaderboard.html">Leaderboard</a>
      </div>
    </div>

    <div class="card" style="padding:14px;">
      <div class="row" style="align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <h3 style="margin:0;">Status</h3>
        <div class="row" style="gap:10px; flex-wrap:wrap;">
          <span class="pill">Active Set: <b id="activeSetName">—</b></span>
          <span class="pill">Pieces Equipped: <b id="activePieces">0</b>/3</span>
        </div>
      </div>
      <div class="small" style="opacity:.85; margin-top:8px;">
        ใส่ <b>Weapon + Armor + Relic</b> ที่เป็นเซ็ตเดียวกัน เพื่อเปิด Set Bonus
      </div>
    </div>

    <div class="card" style="padding:14px; margin-top:14px;">
      <div class="row" style="align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <h3 style="margin:0;">All Sets</h3>
        <select id="filterOwned" style="height:40px; border-radius:10px; padding:6px 10px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.25); color:#fff;">
          <option value="all">Show: All</option>
          <option value="owned">Show: Owned</option>
          <option value="complete">Show: Can Complete (≥1 each slot)</option>
        </select>
      </div>

      <div id="setsGrid" class="sets-grid" style="margin-top:12px;"></div>
    </div>
  </div>

  <script src="js/firebase-init.js"></script>
  <script type="module" src="./js/sets.js"></script>
</body>
</html>
