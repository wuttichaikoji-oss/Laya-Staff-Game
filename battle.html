<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Battle • Laya Tower RPG</title>
  <link rel="stylesheet" href="./css/game.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <div class="brand">Battle</div>
        <div class="small">Turn-based • Choose skill each turn</div>
      </div>
      <div class="row">
        <a class="btn" href="./index.html">Back to Lobby</a>
      </div>
    </div>

    <div class="grid two">
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div>
            <div style="font-weight:900; font-size:16px;" id="plName">Player</div>
            <div class="small"><span id="plClass">-</span> • LV <b id="plLv">1</b></div>
          </div>
          <div class="row">
            <span class="pill">Element: <b id="plEl">Neutral</b></span>
          </div>
        </div>
        <div style="margin-top:10px;">
          <div class="small">HP <span id="plHpTxt"></span></div>
          <div class="bar hp" style="margin-top:6px;"><div id="plHpBar"></div></div>
          <div class="small" style="margin-top:10px;">MP <span id="plMpTxt"></span></div>
          <div class="bar mp" style="margin-top:6px;"><div id="plMpBar"></div></div>
        </div>

        <div style="margin-top:12px;" class="row">
          <span class="badge" id="plBuffs">No buffs</span>
          <span class="badge bad" id="plDebuffs" style="display:none;">-</span>
        </div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div>
            <div style="font-weight:900; font-size:16px;" id="enName">Enemy</div>
            <div class="small">Floor <b id="enFloor">1</b> • DEF Lv <b id="enDefLv">1</b></div>
          </div>
          <div class="row">
            <span class="pill">Element: <b id="enEl">Neutral</b></span>
          </div>
        </div>
        <div style="margin-top:10px;">
          <div class="small">HP <span id="enHpTxt"></span></div>
          <div class="bar hp" style="margin-top:6px;"><div id="enHpBar"></div></div>
        </div>

        <div style="margin-top:12px;" class="row">
          <span class="badge" id="enBuffs">No buffs</span>
          <span class="badge bad" id="enDebuffs" style="display:none;">-</span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="row" style="justify-content:space-between; align-items:flex-start;">
        <div>
          <h3 style="margin:0 0 4px 0;">Your Turn</h3>
          <div class="small">เลือกสกิล → ระบบคำนวณธาตุ ROC + สถานะ → ศัตรูโต้กลับ</div>
        </div>
        <div class="row">
          <span class="pill">Turn: <b id="turnNo">1</b></span>
          <span class="pill">Gold: <b id="pGold2">0</b></span>
        </div>
      </div>

      <div class="skillbar" id="skillBar" style="margin-top:12px;"></div>

      <div class="row" style="margin-top:12px; justify-content:space-between;">
        <button class="btn" id="btnEnd" disabled>End Turn</button>
        <button class="btn primary" id="btnNext" style="display:none;">Next Floor</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h3 style="margin:0 0 10px 0;">Battle Log</h3>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script src="./js/element-table-roc.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/battle.js"></script>
</body>
</html>
