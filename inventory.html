<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Laya Staff Task • Inventory</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg">
  <div class="container" style="max-width:980px;">
    <div class="topbar">
      <div>
        <div class="brand">Laya Staff Task</div>
        <div class="small">Inventory & Equipment</div>
      </div>
      <div class="actions">
        <a class="btn secondary" href="./game.html">Back</a>
        <a class="btn secondary" href="./shop.html">Shop</a>
        <a class="btn secondary" href="./sets.html">Sets</a>
        <a class="btn secondary" href="./badges.html">Badges</a>
        <a class="btn secondary" href="./quests.html">Quests</a>
        <a class="btn secondary" href="./leaderboard.html">Leaderboard</a>
      </div>
    </div>

    <div class="card" style="padding:14px;">
      <div class="row" style="align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <h3 style="margin:0;">Equipped</h3>
        <div class="row" style="gap:10px; flex-wrap:wrap;">
          <span class="pill">Gold: <b id="invGold">0</b></span>
          <span class="pill">Essence: <b id="invEssence">0</b></span>
        </div>
      </div>
      <div class="grid three" id="equipSummary"></div>
      <div class="small" style="opacity:.85; margin-top:10px;">
        โบนัสจากไอเทมจะมีผลกับ Battle: ATK% เพิ่มดาเมจ และ Weapon Imbue จะเปลี่ยนธาตุโจมตี (เฉพาะสกิล Physical)
      </div>
    </div>

    <div class="card" style="padding:14px; margin-top:14px;">
      <div class="row" style="align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <h3 style="margin:0;">Inventory</h3>
        <div class="row" style="gap:10px; align-items:center; flex-wrap:wrap;">
          <select id="filterSlot" style="height:40px; border-radius:10px; padding:6px 10px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.25); color:#fff;">
            <option value="all">All Slots</option>
            <option value="weapon">Weapon</option>
            <option value="armor">Armor</option>
            <option value="relic">Relic</option>
          </select>
          <button class="btn secondary" id="btnSort">Sort: Rarity</button>
        </div>
      </div>
      <div id="invList" class="inv-list" style="margin-top:12px;"></div>
    </div>
  </div>

  <script src="js/firebase-init.js"></script>
  <script type="module" src="./js/inventory.js"></script>
</body>
</html>
